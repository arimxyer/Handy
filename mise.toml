# Project-specific mise configuration for Handy (insiders fork)

# === Development ===

[tasks.install]
description = "Install frontend dependencies"
run = "bun install"

[tasks.dev]
description = "Start Tauri development server"
run = "bun run tauri dev"

[tasks.build]
description = "Build for production (all bundles)"
run = "bun run tauri build"

[tasks."build:local"]
description = "Build binary + deb only (skip AppImage)"
run = "bun run tauri build --bundles deb --no-sign"

# === Code Quality (Frontend) ===

[tasks.lint]
description = "Lint frontend code"
run = "bun run lint"

[tasks."lint:fix"]
description = "Lint frontend with auto-fix"
run = "bun run lint:fix"

[tasks.format]
description = "Format all code (Prettier + cargo fmt)"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without changes"
run = "bun run format:check"

# === Code Quality (Backend) ===

[tasks.clippy]
description = "Run cargo clippy on backend"
run = "cd src-tauri && cargo clippy"

[tasks."cargo:check"]
description = "Fast compile check without building"
run = "cd src-tauri && cargo check"

[tasks."cargo:fmt"]
description = "Format Rust code"
run = "cd src-tauri && cargo fmt"

[tasks."cargo:test"]
description = "Run Rust unit tests"
run = "cd src-tauri && cargo test"

[tasks."cargo:fetch"]
description = "Download Rust dependencies without compiling"
run = "cd src-tauri && cargo fetch"

# === Testing ===

[tasks.test]
description = "Run Playwright tests"
run = "bun run test:playwright"

[tasks."test:ui"]
description = "Run Playwright tests with UI"
run = "bun run test:playwright:ui"

# === Utilities ===

[tasks."check:translations"]
description = "Check translation file consistency"
run = "bun run check:translations"

# === Fork Workflow ===

[tasks.export-patches]
description = "Export insiders patches relative to main"
run = "git format-patch main --output-directory patches/"

[tasks.apply-patches]
description = "Apply exported patches to current branch"
run = "git am patches/*.patch"

[tasks.sync-upstream]
description = "Sync main with upstream; integrate insiders separately"
run = """
git fetch upstream
git checkout main
git merge upstream/main
git push origin main
git checkout insiders
echo 'Main synced. Create a separate worktree/branch for insiders integration.'
"""
